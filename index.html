  if(!q){if(!quiet)say('iPhone không hỗ trợ toàn màn hình trong Safari. Bấm Chia sẻ → Thêm vào Màn hình chính, rồi mở từ biểu tượng đó để xem toàn màn hình.');return}
  if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
  else{const p=q.call(e);if(p&&p.catch)p.catch(()=>{})}};
fb.addEventListener('pointerdown',e=>e.stopPropagation());
fb.addEventListener('click',e=>{e.stopPropagation();fs(false)});
if(navigator.standalone||matchMedia('(display-mode:standalone)').matches)fb.style.display='none';
addEventListener('dblclick',()=>fs(true));addEventListener('pointerdown',restart);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='r')restart();if(k==='f')fs(true)});
setup();reset();requestAnimationFrame(loop);
</script></body></html>
